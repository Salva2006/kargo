<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reseñas - KARGO</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#f8f8f8]">

<!-- BOTON VOLVER - ESTO ES LO QUE TE FALTABA -->
<div class="max-w-3xl mx-auto p-6">
  <a href="index.html" class="inline-flex items-center gap-2 bg-white px-4 py-2 rounded-full shadow text-sm font-bold hover:bg-black hover:text-white transition">
    <i class="fa-solid fa-arrow-left"></i> Volver a la tienda
  </a>
</div>

<div class="max-w-3xl mx-auto p-6 -mt-6">
  <h1 class="text-3xl font-black text-center">¿Qué dicen de KARGO? 🔥</h1>
  <p class="text-center text-gray-500 text-sm">Reseñas reales de clientes reales</p>

  <div class="bg-white p-6 rounded-2xl shadow-lg mt-8 mb-10">
    <h2 class="font-bold mb-2">Deja tu reseña</h2>
    <div class="flex gap-1 text-2xl mb-4" id="stars">
      <i class="fa-solid fa-star text-yellow-400 cursor-pointer" data-v="1"></i>
      <i class="fa-solid fa-star text-yellow-400 cursor-pointer" data-v="2"></i>
      <i class="fa-solid fa-star text-yellow-400 cursor-pointer" data-v="3"></i>
      <i class="fa-solid fa-star text-yellow-400 cursor-pointer" data-v="4"></i>
      <i class="fa-solid fa-star text-yellow-400 cursor-pointer" data-v="5"></i>
    </div>

    <input id="nombre" placeholder="Tu nombre" class="w-full border p-3 rounded-xl mb-3">
    
    <!-- SELECTOR DE PRODUCTO -->
    <select id="producto" class="w-full border p-3 rounded-xl mb-3 bg-white">
      <option value="">Elige tu producto</option>
      <option value="Dron KARGO">Dron KARGO</option>
      <option value="Cámara">Cámara</option>
      <option value="Luz LED">Luz LED</option>
      <option value="Otro">Otro</option>
    </select>

    <textarea id="comentario" placeholder="¿Qué te pareció tu producto KARGO?" class="w-full border p-3 rounded-xl mb-3 h-24"></textarea>
    <button id="btnEnviar" class="w-full bg-black text-white py-3 rounded-xl font-bold">Enviar reseña</button>
    <p id="msg" class="hidden text-center text-green-600 mt-3 text-sm font-bold"></p>
  </div>

  <div id="lista" class="space-y-4"></div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbw_qSzItDB5F-rcWKoT6Bi6Ihm5RalG5aP842f3Eh3h4XXqIRwiI7IMoOXYzgUO2Vx4TQ/exec";
let estrellas = 5;
document.querySelectorAll('#stars i').forEach(el=>{
  el.addEventListener('click', ()=>{
    estrellas = parseInt(el.dataset.v);
    document.querySelectorAll('#stars i').forEach((s,i)=>{
      s.className = (i < estrellas? 'fa-solid fa-star text-yellow-400 cursor-pointer' : 'fa-solid fa-star text-gray-300 cursor-pointer');
    });
  });
});
async function cargar(){
  try {
    const r = await fetch(API_URL); 
    const data = await r.json();
    document.getElementById('lista').innerHTML = data.reverse().map(d=>`
      <div class="bg-white p-5 rounded-2xl shadow">
        <b>${d.nombre || 'Anónimo'}</b> <span class="text-yellow-400">${'★'.repeat(d.estrellas||5)}</span>
        <span class="text-xs bg-gray-100 px-2 py-1 rounded-full ml-2">${d.producto || 'General'}</span>
        <p class="mt-2 text-gray-700">${d.comentario}</p>
        <p class="text-xs text-gray-400 mt-2">${d.fecha || ''}</p>
      </div>`).join('');
  } catch(e){ console.log(e) }
}
cargar();
document.getElementById('btnEnviar').addEventListener('click', async ()=>{
  const nombre = document.getElementById('nombre').value.trim();
  const producto = document.getElementById('producto').value;
  const comentario = document.getElementById('comentario').value.trim();
  if(!nombre || !comentario) return alert('Completa tu nombre y comentario pe');
  if(!producto) return alert('Elige tu producto pe');
  const btn = document.getElementById('btnEnviar'); btn.textContent='Enviando...';
  await fetch(API_URL, { method:'POST', mode:'no-cors', body:JSON.stringify({fecha: new Date().toLocaleString('es-PE'), nombre, producto, estrellas, comentario, foto: ''}) });
  document.getElementById('msg').textContent='¡Reseña guardada! Gracias 🔥'; 
  document.getElementById('msg').classList.remove('hidden');
  setTimeout(()=>{ cargar(); btn.textContent='Enviar reseña'; },1500);
});
</script>
</body>
</html>
