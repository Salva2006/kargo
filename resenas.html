<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reseñas - KARGO</title>
<style>
  body{font-family:Arial;background:#f5f5f5;margin:0;padding:20px}
 .caja{max-width:600px;margin:0 auto 20px;background:white;padding:20px;border-radius:15px;box-shadow:0 2px 10px #0001}
  input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-top:10px;box-sizing:border-box}
  button{width:100%;padding:13px;background:black;color:white;border:none;border-radius:10px;margin-top:15px;font-weight:bold;cursor:pointer}
 .volver{display:inline-block;background:white;padding:10px 15px;border-radius:20px;text-decoration:none;color:black;font-weight:bold;box-shadow:0 1px 5px #0002}
</style>
</head>
<body>

<div style="max-width:600px;margin:0 auto 20px;">
  <a href="index.html" class="volver">← Volver a la tienda</a>
</div>

<div class="caja">
  <h2 style="text-align:center;margin:0">¿Qué dicen de KARGO? 🔥</h2>
  <p style="text-align:center;color:gray;font-size:13px">Reseñas reales de clientes reales</p>
  <hr style="margin:15px 0;border:none;border-top:1px solid #eee">
  <b>Deja tu reseña</b>
  <div style="font-size:28px;color:#ffc107;margin:5px 0" id="stars">★★★★★</div>
  <input id="nombre" placeholder="Tu nombre">
  <!-- ESTE SELECTOR AHORA SE LLENA SOLO -->
  <select id="producto"><option>Cargando productos de tu tienda...</option></select>
  <textarea id="comentario" placeholder="¿Qué te pareció tu producto KARGO?"></textarea>
  <button id="btnEnviar">Enviar reseña</button>
  <p id="msg" style="display:none;color:green;text-align:center;font-weight:bold;margin-top:10px;"></p>
</div>
<div id="lista" style="max-width:600px;margin:0 auto;padding-bottom:50px;"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbw_qSzItDB5F-rcWKoT6Bi6Ihm5RalG5aP842f3Eh3h4XXqIRwiI7IMoOXYzgUO2Vx4TQ/exec";
let estrellas = 5;

// --- ESTA ES LA MAGIA QUE PEDISTE: LEE AUTOMATICAMENTE TUS PRODUCTOS DE INDEX.HTML ---
async function cargarProductosReales(){
  const select = document.getElementById('producto');
  try{
    const resp = await fetch('index.html?v='+Date.now());
    const html = await resp.text();
    const doc = new DOMParser().parseFromString(html, 'text/html');

    // Busca todos los textos de productos en tu index
    // En tu web los nombres estan justo antes de "S/ 25", "S/ 115", etc.
    let nombres = [];
    // Estrategia 1: busca por las tarjetas de Productos Destacados
    doc.querySelectorAll('*').forEach(el=>{
      const txt = el.textContent.trim();
      if(txt.length > 3 && txt.length < 60){
        // Es un posible nombre si luego hay un precio cerca
        if(el.nextElementSibling && el.nextElementSibling.textContent.includes('S/')) nombres.push(txt);
      }
    });
    // Estrategia 2 (más segura): extrae con regex del html fuente
    const regex = />(Set de bloques WALL-E|Drone E88|Cinturón[^<]+|Cargador[^<]+|[^<>]{4,40})<\/[^>]*>\s*[^<]*S\/\s*\d+/g;
    let m;
    while((m = regex.exec(html))!== null){
      let n = m[1].trim().replace(/<[^>]+>/g,'');
      if(n.length>3 &&!n.includes('Comprar') &&!n.includes('Productos') &&!n.includes('KARGO -')) nombres.push(n);
    }
    // Limpia duplicados
    nombres = [...new Set(nombres)].filter(n=> n.length>3 && n.length<50);

    // Si no encuentra nada, usa los que vimos en tu video
    if(nombres.length < 2){
      nombres = ["Set de bloques WALL-E", "Drone E88", "Cinturón de nailon", "Cargador solar portátil"];
    }

    select.innerHTML = '<option value="">-- Elige tu producto --</option>' + nombres.map(n=>`<option value="${n}">${n}</option>`).join('') + '<option value="Otro">Otro</option>';
  }catch(e){
    select.innerHTML = '<option value="">-- Elige tu producto --</option><option>Set de bloques WALL-E</option><option>Drone E88</option><option>Cinturón de nailon</option><option>Cargador solar portátil</option><option>Otro</option>';
  }
}
cargarProductosReales();

// --- CARGAR RESEÑAS ---
async function cargar(){
  try{
    const r = await fetch(API_URL);
    const data = await r.json();
    document.getElementById('lista').innerHTML = data.reverse().map(d=>`
      <div class="caja"><b>${d.nombre||'Anónimo'}</b> <span style="color:#ffc107">${'★'.repeat(d.estrellas||5)}</span>
      <span style="background:#eee;font-size:12px;padding:3px 8px;border-radius:10px;margin-left:5px">${d.producto||''}</span>
      <p style="margin:10px 0 0">${d.comentario}</p><small style="color:gray">${d.fecha||''}</small></div>
    `).join('');
  }catch(e){}
}
cargar();

document.getElementById('btnEnviar').addEventListener('click', async ()=>{
  const nombre = document.getElementById('nombre').value.trim();
  const producto = document.getElementById('producto').value;
  const comentario = document.getElementById('comentario').value.trim();
  if(!nombre ||!comentario){ alert('Pon tu nombre y comentario pe'); return; }
  if(!producto){ alert('Elige qué producto estás calificando'); return; }
  const btn = document.getElementById('btnEnviar'); btn.textContent='Enviando...';
  await fetch(API_URL, {method:'POST', mode:'no-cors', body:JSON.stringify({fecha: new Date().toLocaleString('es-PE'), nombre, producto, estrellas, comentario, foto: ''})});
  document.getElementById('msg').style.display='block'; document.getElementById('msg').textContent='¡Reseña guardada! 🔥';
  setTimeout(()=>{ cargar(); btn.textContent='Enviar reseña'; },1000);
});
</script>
</body>
</html>
