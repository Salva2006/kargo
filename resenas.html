<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reseñas KARGO</title>
<style>body{font-family:Arial;max-width:700px;margin:0 auto;padding:16px;background:#f5f5f5}.card{background:#fff;padding:20px;border-radius:16px;box-shadow:0 4px 15px rgba(0,0,0,.08)}input,select,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}button{width:100%;padding:14px;background:#000;color:#fff;border:none;border-radius:12px;font-weight:900;cursor:pointer}.estrellas{font-size:32px;color:#ddd;cursor:pointer}.estrellas.active{color:#ffb400}.resena{background:#fff;padding:14px;border-radius:12px;margin:10px 0}.resena img{width:100%;max-height:320px;object-fit:cover;border-radius:10px;margin-top:8px}#preview{width:100%;border-radius:12px;display:none;margin-top:10px;max-height:300px;object-fit:cover}</style>
</head>
<body>
<a href="index.html">← Volver a la tienda</a>
<h2>¿Qué dicen de KARGO? 🔥</h2>

<div class="card">
<div id="stars"><span class="estrellas" data-v="1">★</span><span class="estrellas" data-v="2">★</span><span class="estrellas" data-v="3">★</span><span class="estrellas" data-v="4">★</span><span class="estrellas" data-v="5">★</span></div>
<input id="nombre" placeholder="Tu nombre ej: Sheila">

<!-- AHORA ES SELECT, NO SE ESCRIBE -->
<select id="producto">
<option value="">-- Elige tu producto --</option>
<option value="Set de bloques WALL-E">Set de bloques WALL-E</option>
<option value="Drone E88">Drone E88</option>
<option value="Cinturón de nailon">Cinturón de nailon</option>
<option value="Cargador solar portátil">Cargador solar portátil</option>
</select>

<textarea id="comentario" placeholder="¿Qué te pareció?"></textarea>
<input type="file" id="fotoFile" accept="image/*">
<img id="preview">
<div id="estado" style="text-align:center;font-weight:700;margin:8px"></div>
<button id="btnEnviar">Enviar reseña con foto</button>
</div>

<div id="lista"></div>

<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbw_qSzItDB5F-rcWKoT6Bi6Ihm5RalG5aP842f3Eh3h4XXqIRwiI7IMoOXYzgUO2Vx4TQ/exec';
let est=5;
document.querySelectorAll('.estrellas').forEach(s=>{s.addEventListener('click',()=>{est=parseInt(s.dataset.v);pintar();})});
function pintar(){document.querySelectorAll('.estrellas').forEach(s=>s.classList.toggle('active',parseInt(s.dataset.v)<=est));} pintar();

const fileInput=document.getElementById('fotoFile');
const preview=document.getElementById('preview');
fileInput.addEventListener('change',()=>{
 const f=fileInput.files[0]; if(!f) return;
 const r=new FileReader(); r.onload=e=>{preview.src=e.target.result; preview.style.display='block';}; r.readAsDataURL(f);
});

function comprimir(file){return new Promise(res=>{const rd=new FileReader();rd.onload=e=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');const max=900;let w=im.width,h=im.height;if(w>max||h>max){if(w>h){h=h*max/w;w=max;}else{w=w*max/h;h=max;}}c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);res(c.toDataURL('image/jpeg',0.75));};im.src=e.target.result;};rd.readAsDataURL(file);});}

async function cargar(){
 const r=await fetch(SCRIPT_URL); const d=await r.json();
 document.getElementById('lista').innerHTML=d.reverse().map(x=>`<div class="resena"><b>${x.nombre}</b> - ${'★'.repeat(x.estrellas||5)}<br><small>${x.producto}</small><br>${x.comentario}${x.foto?`<br><img src="${x.foto}" loading="lazy">`:''}</div>`).join('');
} cargar();

document.getElementById('btnEnviar').addEventListener('click',async()=>{
 const btn=document.getElementById('btnEnviar'); const estado=document.getElementById('estado');
 const nombre=document.getElementById('nombre').value.trim();
 const producto=document.getElementById('producto').value;
 const comentario=document.getElementById('comentario').value.trim();
 if(!nombre||!producto||!comentario){alert('Completa todo pe');return;}
 btn.disabled=true; estado.textContent='Subiendo...';
 let fotoData=""; if(fileInput.files[0]) fotoData=await comprimir(fileInput.files[0]);
 try{
  await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({nombre,producto,estrellas:est,comentario,fotoData})});
  estado.textContent='¡Listo! 🔥'; preview.style.display='none'; fileInput.value=''; cargar();
 }catch(e){estado.textContent='Error';} finally{btn.disabled=false;}
});
</script></body></html>
