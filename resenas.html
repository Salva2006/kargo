<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reseñas - KARGO</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#f8f8f8] font-sans">

<div class="max-w-3xl mx-auto p-6 mt-10">
  <h1 class="text-3xl font-black text-center mb-2">¿Qué dicen de KARGO? 🔥</h1>
  <p class="text-center text-gray-500 mb-8">Reseñas reales de clientes reales</p>

  <!-- FORMULARIO -->
  <div class="bg-white p-6 rounded-2xl shadow-lg mb-10">
    <h2 class="font-bold text-lg mb-4">Deja tu reseña</h2>
    <div class="flex gap-1 text-2xl mb-4" id="stars">
      <i class="fa-solid fa-star text-gray-300 cursor-pointer" data-v="1"></i>
      <i class="fa-solid fa-star text-gray-300 cursor-pointer" data-v="2"></i>
      <i class="fa-solid fa-star text-gray-300 cursor-pointer" data-v="3"></i>
      <i class="fa-solid fa-star text-gray-300 cursor-pointer" data-v="4"></i>
      <i class="fa-solid fa-star text-gray-300 cursor-pointer" data-v="5"></i>
    </div>
    <input id="nombre" type="text" placeholder="Tu nombre" class="w-full border p-3 rounded-xl mb-3">
    <textarea id="comentario" placeholder="¿Qué te pareció tu producto KARGO?" class="w-full border p-3 rounded-xl mb-3 h-24"></textarea>
    <button id="btnEnviar" class="w-full bg-black text-white py-3 rounded-xl font-bold hover:bg-zinc-800">Enviar reseña</button>
    <p id="msg" class="text-center text-sm mt-3 text-green-600 hidden"></p>
  </div>

  <!-- LISTA DE RESEÑAS -->
  <div id="lista" class="space-y-4">
    <p class="text-center text-gray-400">Cargando reseñas...</p>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbw_qSzItDB5F-rcWKoT6Bi6Ihm5RalG5aP842f3Eh3h4XXqIRwiI7IMoOXYzgUO2Vx4TQ/exec";
let estrellas = 5;

// estrellas
document.querySelectorAll('#stars i').forEach(el=>{
  el.addEventListener('click', ()=>{
    estrellas = parseInt(el.dataset.v);
    document.querySelectorAll('#stars i').forEach((s,i)=>{
      s.classList.toggle('text-yellow-400', i < estrellas);
      s.classList.toggle('text-gray-300', i >= estrellas);
    });
  });
});
// seleccionar 5 por defecto
document.querySelectorAll('#stars i').forEach((s,i)=>{ if(i<5){s.classList.add('text-yellow-400'); s.classList.remove('text-gray-300')} })

// cargar reseñas
async function cargar(){
  try{
    const r = await fetch(API_URL);
    const data = await r.json();
    const cont = document.getElementById('lista');
    if(!data.length){ cont.innerHTML = '<p class="text-center text-gray-400">Sé el primero en dejar una reseña</p>'; return; }
    cont.innerHTML = data.reverse().map(d=>`
      <div class="bg-white p-5 rounded-2xl shadow">
        <div class="flex justify-between items-center">
          <b>${d.nombre || 'Anónimo'}</b>
          <span class="text-yellow-400">${'★'.repeat(d.estrellas || 5)}<span class="text-gray-300">${'★'.repeat(5-(d.estrellas||5))}</span></span>
        </div>
        <p class="text-gray-700 mt-2">${d.comentario || ''}</p>
        <p class="text-xs text-gray-400 mt-2">${d.fecha || ''}</p>
      </div>
    `).join('');
  }catch(e){ document.getElementById('lista').innerHTML = '<p class="text-center text-red-400">Error cargando reseñas</p>'; }
}
cargar();

// enviar
document.getElementById('btnEnviar').addEventListener('click', async ()=>{
  const nombre = document.getElementById('nombre').value.trim();
  const comentario = document.getElementById('comentario').value.trim();
  if(!nombre || !comentario){ alert('Pon tu nombre y comentario pe'); return; }
  const btn = document.getElementById('btnEnviar');
  btn.textContent = 'Enviando...'; btn.disabled = true;
  try{
    await fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ nombre, comentario, estrellas, fecha: new Date().toLocaleDateString('es-PE') }) });
    document.getElementById('msg').textContent = '¡Gracias! Tu reseña se guardó en KARGO Reseñas ✅'; 
    document.getElementById('msg').classList.remove('hidden');
    document.getElementById('comentario').value = '';
    setTimeout(cargar, 1500);
  }catch(e){ alert('Error al enviar'); }
  btn.textContent = 'Enviar reseña'; btn.disabled = false;
});
</script>
</body>
</html>
